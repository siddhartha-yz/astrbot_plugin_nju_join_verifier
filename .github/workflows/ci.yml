name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "aiohttp>=3.9,<4" "pytest>=8,<9" "ruff==0.16.3"
      - name: Ruff
        run: ruff check main.py nju_join_verifier tests runtime_checks
      - name: Pytest
        run: pytest -q
      - name: Compile
        run: python -m compileall -q main.py nju_join_verifier tests runtime_checks
      - name: AstrBot 4.27.3 plugin-load smoke
        shell: bash
        run: |
          set -euo pipefail
          volume="nju-join-verifier-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="nju-join-verifier-smoke"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" --network none \
            -v "$volume:/AstrBot/data" \
            -v "$GITHUB_WORKSPACE:/AstrBot/data/plugins/nju_join_verifier:ro" \
            soulter/astrbot@sha256:e51e924d47c5921b9f92afd9c9bb1d459cb5eda33185b494515464f4b051d9bc >/dev/null
          ok=0
          for _ in $(seq 1 30); do
            logs="$(docker logs "$container" 2>&1 || true)"
            if grep -q 'Plugin nju_join_verifier (' <<<"$logs" && grep -q 'AstrBot started.' <<<"$logs"; then
              ok=1
              break
            fi
            if grep -Eq 'Failed to import plugin nju_join_verifier|Traceback' <<<"$logs"; then
              printf '%s\n' "$logs"
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker logs "$container" 2>&1 || true
          fi
          cleanup
          trap - EXIT
          [ "$ok" = 1 ]
      - name: AstrBot policy behavior smoke
        run: |
          docker run --rm -i --network none --entrypoint python \
            -v "$GITHUB_WORKSPACE:/plugin:ro" -w /tmp \
            soulter/astrbot@sha256:e51e924d47c5921b9f92afd9c9bb1d459cb5eda33185b494515464f4b051d9bc \
            /plugin/runtime_checks/astrbot_policy_smoke.py
